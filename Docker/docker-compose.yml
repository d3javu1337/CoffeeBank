version: '3.9'

volumes:
  postgres_data:
  kafka_cluster_data:

networks:
  app:
    driver: bridge

services:
  db:
    image: postgres:16.3-alpine
    restart: always
    environment:
      POSTGRES_DB: CoffeeBank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - 5432
    ports:
      - '5433:5432'
    volumes:
      - ./database/sql/init.sql:/docker-entrypoint-initdb.d/001.sql
      - ./database/sql/insert.sql:/docker-entrypoint-initdb.d/002.sql
      - postgres_data:/var/lib/postgresql/data
    hostname: database
    container_name: database
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 500MB
        reservations:
          memory: 500MB

  business-backend:
    build:
      context: '../../CoffeeBank/Apps/BankBusiness/backend'
      dockerfile: Dockerfile
    expose:
      - 1337
      - 9090
    ports:
      - '1337:1337'
    networks:
      - app
    depends_on:
      - db
    container_name: business-backend
    hostname: business-backend
    deploy:
      resources:
        limits:
          memory: 500MB
        reservations:
          memory: 500MB

  core-backend:
    build:
      context: '../../CoffeeBank/Apps/BankCore/backend'
      dockerfile: Dockerfile
    expose:
      - 9090
      - 8080
    container_name: core-backend
    hostname: core-backend
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://database:5432/CoffeeBank'
      SPRING_KAFKA_MAIN_CONSUMER_BOOTSTRAP-SERVERS: "kafka-broker:9092"
    networks:
      - app
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 500MB
        reservations:
          memory: 500MB

  business-frontend:
    build:
      context: '../../CoffeeBank/Apps/BankBusiness/frontend'
      dockerfile: Dockerfile
    expose:
      - 80
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=http://:1337/api
    volumes:
      - ./business/front/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 500MB
        reservations:
          memory: 500MB

  kafka-controller:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      CLUSTER_ID: "27a1f978-7439-48f5-ae2a-ced1b8646668"
    command:
      - /bin/bash
      - -c
      - |
        export KAFKA_ADVERTISED_LISTENERS=CONTROLLER://kafka-controller:9093
        kafka-storage format --config /etc/kafka/kafka.properties --cluster-id your-cluster-id --ignore-formatted
        unset KAFKA_ADVERTISED_LISTENERS
        /etc/confluent/docker/run
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kafka-broker:
    image: confluentinc/cp-kafka:latest
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: "27a1f978-7439-48f5-ae2a-ced1b8646668"
    command:
      - /bin/bash
      - -c
      - |
        kafka-storage format --config /etc/kafka/kafka.properties --cluster-id your-cluster-id --ignore-formatted
        /etc/confluent/docker/run
    depends_on:
      - kafka-controller
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M